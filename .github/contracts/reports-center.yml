name: SEGEMPAT Reports Center

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: segempat-reports-center-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reports-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate unified reports center
        shell: bash
        run: |
          set -euo pipefail
          FILE=src/routes/_authenticated/relatorios.tsx
          MONTHLY=src/components/reports/MonthlyReportWorkspace.tsx
          grep -F 'Central de Relatórios' "$FILE" >/dev/null
          grep -F 'Visão Executiva' "$FILE" >/dev/null
          grep -F 'Fechamento Mensal' "$FILE" >/dev/null
          grep -F '<MonthlyReportWorkspace embedded />' "$FILE" >/dev/null
          grep -F 'exportCsv' "$FILE" >/dev/null
          grep -F 'embedded = false' "$MONTHLY" >/dev/null
          grep -F 'Imprimir visão atual' "$MONTHLY" >/dev/null
          test -f src/routes/_authenticated/relatorio-mensal.tsx
          echo "Central de Relatórios validada."
