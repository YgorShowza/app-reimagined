name: SEGEMPAT Login Experience

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: segempat-login-experience-${{ github.ref }}
  cancel-in-progress: true

jobs:
  login-experience-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate refined login experience
        shell: bash
        run: |
          set -euo pipefail
          test -f src/components/auth/RefinedAuthScreen.tsx
          test -f public/empat-logo.svg
          grep -F 'RefinedAuthScreen' src/routes/index.tsx >/dev/null
          grep -F '"/empat-logo.svg"' src/components/auth/RefinedAuthScreen.tsx >/dev/null
          grep -F 'loginWithMatricula' src/components/auth/RefinedAuthScreen.tsx >/dev/null
          grep -F 'activateWithCode' src/components/auth/RefinedAuthScreen.tsx >/dev/null
          grep -F 'useApiReadiness' src/components/auth/RefinedAuthScreen.tsx >/dev/null
          grep -F 'ThemeSwitcher' src/components/auth/RefinedAuthScreen.tsx >/dev/null
          grep -F 'isDemoModeAllowed' src/components/auth/RefinedAuthScreen.tsx >/dev/null
          grep -F 'DEMO_INSPECTOR_USER' src/components/auth/RefinedAuthScreen.tsx >/dev/null
          grep -F 'DEMO_OPERATOR_USER' src/components/auth/RefinedAuthScreen.tsx >/dev/null
          grep -F 'Dados fictícios' src/components/auth/RefinedAuthScreen.tsx >/dev/null
          grep -F 'max-w-[1180px]' src/components/auth/RefinedAuthScreen.tsx >/dev/null
          ! grep -R -F 'media.base44.com' src/routes/index.tsx src/components/auth/RefinedAuthScreen.tsx
          echo "Experiência de login refinada do SEGEMPAT validada."
