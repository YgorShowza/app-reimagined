name: SEGEMPAT Dependency Security Upgrade

on:
  push:
    branches: [hardening/dependency-security]
    paths:
      - .github/workflows/dependency-lock-preview.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: hardening/dependency-security

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Apply dependency and spreadsheet parser hardening
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceRequired(text, pattern, replacement, label) {
            const next = text.replace(pattern, replacement);
            if (next === text) throw new Error(`Required replacement not applied: ${label}`);
            return next;
          }

          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          delete pkg.dependencies.xlsx;
          pkg.dependencies['read-excel-file'] = '^9.3.10';
          pkg.dependencies.jspdf = '^4.2.1';
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);

          const componentPath = 'src/components/cronograma/CronogramaImportResults.tsx';
          let source = fs.readFileSync(componentPath, 'utf8');

          source = replaceRequired(
            source,
            'import * as XLSX from "xlsx";',
            'import { readSheet } from "read-excel-file/browser";',
            'spreadsheet import'
          );

          source = replaceRequired(
            source,
            /function parseDate\(value: unknown, fallbackMonth: string\) \{[\s\S]*?\n\}\n\nfunction findHeaderRow/,
            `function parseDate(value: unknown, fallbackMonth: string) {
  if (value instanceof Date && Number.isFinite(value.getTime())) {
    const year = value.getUTCFullYear();
    const month = String(value.getUTCMonth() + 1).padStart(2, "0");
    const day = String(value.getUTCDate()).padStart(2, "0");
    return { date: \`${'${year}'}-${'${month}'}-${'${day}'}\`, month: \`${'${year}'}-${'${month}'}\` };
  }
  const raw = String(value ?? "").trim();
  const iso = raw.match(/(\\d{4})-(\\d{2})-(\\d{2})/);
  if (iso) return { date: \`${'${iso[1]}'}-${'${iso[2]}'}-${'${iso[3]}'}\`, month: \`${'${iso[1]}'}-${'${iso[2]}'}\` };
  const br = raw.match(/(\\d{2})\\/(\\d{2})\\/(\\d{4})/);
  if (br) return { date: \`${'${br[3]}'}-${'${br[2]}'}-${'${br[1]}'}\`, month: \`${'${br[3]}'}-${'${br[2]}'}\` };
  return { date: \`${'${fallbackMonth}'}-01\`, month: fallbackMonth };
}

function findHeaderRow`,
            'date parsing'
          );

          source = replaceRequired(
            source,
            /function validateSpreadsheetFile\(file: File\) \{[\s\S]*?\n\}\n\nfunction validateSpreadsheetSignature\(buffer: ArrayBuffer\) \{[\s\S]*?\n\}/,
            `function validateSpreadsheetFile(file: File) {
  const extension = file.name.split(".").pop()?.toLowerCase();
  if (extension !== "xlsx") {
    if (extension === "xls") {
      throw new Error("O formato .xls legado não é aceito por segurança. Salve o arquivo como .xlsx e tente novamente.");
    }
    throw new Error("Formato inválido. Envie somente arquivo .xlsx.");
  }
  if (file.size <= 0) throw new Error("O arquivo selecionado está vazio.");
  if (file.size > MAX_IMPORT_FILE_BYTES) {
    throw new Error("A planilha excede o limite de 5 MB para importação.");
  }
}

function validateSpreadsheetSignature(buffer: ArrayBuffer) {
  const bytes = new Uint8Array(buffer, 0, Math.min(buffer.byteLength, 4));
  const isZip = bytes.length >= 4 && bytes[0] === 0x50 && bytes[1] === 0x4b && bytes[2] === 0x03 && bytes[3] === 0x04;
  if (!isZip) {
    throw new Error("O conteúdo do arquivo não corresponde a uma planilha .xlsx válida.");
  }
}`,
            'spreadsheet file validation'
          );

          source = replaceRequired(
            source,
            /function sheetToObjects\(sheet: XLSX\.WorkSheet\) \{[\s\S]*?\n\}\n\nfunction sameTheme/,
            `function sheetRowsToObjects(rows: unknown[][]) {
  if (!rows.length) return [] as Record<string, unknown>[];
  if (rows.length > MAX_IMPORT_ROWS + 16) throw new Error(\`A planilha excede o limite de ${'${MAX_IMPORT_ROWS}'} linhas de dados.\`);

  const columnCount = rows.reduce((largest, row) => Math.max(largest, row?.length ?? 0), 0);
  if (columnCount > MAX_IMPORT_COLUMNS) throw new Error(\`A planilha excede o limite de ${'${MAX_IMPORT_COLUMNS}'} colunas.\`);

  const headerIndex = findHeaderRow(rows);
  const headers = rows[headerIndex] ?? [];
  if (headers.length > MAX_IMPORT_COLUMNS) throw new Error(\`A planilha excede o limite de ${'${MAX_IMPORT_COLUMNS}'} colunas.\`);

  const output: Record<string, unknown>[] = [];
  for (let index = headerIndex + 1; index < rows.length; index += 1) {
    const row = rows[index] ?? [];
    if (row.every((cell) => cell === "" || cell === null || cell === undefined)) continue;
    const item = Object.create(null) as Record<string, unknown>;
    headers.forEach((header, column) => {
      const label = String(header ?? "").trim();
      if (!label || BLOCKED_HEADER_NAMES.has(label.toLowerCase())) return;
      item[label] = row[column] ?? "";
    });
    output.push(item);
    if (output.length > MAX_IMPORT_ROWS) throw new Error(\`A planilha excede o limite de ${'${MAX_IMPORT_ROWS}'} linhas de dados.\`);
  }
  return output;
}

function sameTheme`,
            'sheet row conversion'
          );

          source = replaceRequired(
            source,
            /      const buffer = await file\.arrayBuffer\(\);\n      validateSpreadsheetSignature\(buffer\);\n      const workbook = XLSX\.read\(buffer, \{[\s\S]*?      const rawRows = sheetToObjects\(sheet\);/,
            `      const buffer = await file.arrayBuffer();
      validateSpreadsheetSignature(buffer);
      const sheetRows = await readSheet(file);
      const rawRows = sheetRowsToObjects(sheetRows as unknown[][]);`,
            'spreadsheet read flow'
          );

          source = replaceRequired(source, 'accept=".xlsx,.xls"', 'accept=".xlsx"', 'file input accept');
          source = replaceRequired(
            source,
            'Aceita .xlsx e .xls de até 5 MB. Nenhum dado é gravado antes da revisão.',
            'Aceita .xlsx de até 5 MB. Arquivos .xls legados devem ser salvos como .xlsx. Nenhum dado é gravado antes da revisão.',
            'upload guidance'
          );

          if (/\bXLSX\b/.test(source) || /from\s+["']xlsx["']/.test(source)) {
            throw new Error('Legacy xlsx parser reference remains in component');
          }

          fs.writeFileSync(componentPath, source);
          NODE

      - name: Regenerate Bun lockfile from official npm registry
        shell: bash
        run: |
          rm -f bun.lock
          bun install --ignore-scripts --registry=https://registry.npmjs.org
          bun install --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org

      - name: Verify dependency resolution
        shell: bash
        run: |
          test -f bun.lock
          ! grep -q '"xlsx"' package.json
          ! grep -Eq '(^|["/])xlsx(["@/]|$)' bun.lock
          grep -q 'read-excel-file@9.3.10' bun.lock
          grep -q 'jspdf@4.2.1' bun.lock
          grep -q 'read-excel-file/browser' src/components/cronograma/CronogramaImportResults.tsx

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Dependency audit report
        continue-on-error: true
        run: bun audit

      - name: Commit validated dependency hardening to branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock src/components/cronograma/CronogramaImportResults.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Replace vulnerable spreadsheet parser and update jsPDF"
          git push origin HEAD:hardening/dependency-security
