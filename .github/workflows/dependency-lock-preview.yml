name: SEGEMPAT Sharp Security Upgrade

on:
  push:
    branches: [hardening/dependency-security]
    paths:
      - .github/workflows/dependency-lock-preview.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: hardening/dependency-security

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Pin safe sharp transitive version
        shell: bash
        run: |
          node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.overrides=p.overrides||{};p.overrides.sharp='0.35.4';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\\n');"

      - name: Regenerate Bun lockfile from official npm registry
        shell: bash
        run: |
          rm -f bun.lock
          bun install --ignore-scripts --registry=https://registry.npmjs.org
          bun install --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org

      - name: Verify dependency resolution
        shell: bash
        run: |
          test -f bun.lock
          grep -q 'sharp@0.35.4' bun.lock
          ! grep -q 'sharp@0.35.2' bun.lock
          ! grep -q '"xlsx"' package.json
          ! grep -Eq '(^|["/])xlsx(["@/]|$)' bun.lock
          grep -q 'read-excel-file@9.3.10' bun.lock
          grep -q 'jspdf@4.2.1' bun.lock

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Dependency audit
        run: bun audit

      - name: Commit validated sharp override to branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git diff --cached --quiet && exit 0
          git commit -m "Override vulnerable sharp transitive dependency"
          git push origin HEAD:hardening/dependency-security
