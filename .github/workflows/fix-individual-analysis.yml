name: SEGEMPAT Individual Analysis Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fix individual analysis type contract
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/routes/_authenticated/individual.tsx')
          text = path.read_text()
          text = text.replace('  const failed = activeRow?.unresolvedFailed ?? 0;\n', '')
          old = '<Card className="p-5 text-center text-xs" style={{ color: "var(--text-4)" } as React.CSSProperties}>Nenhum colaborador encontrado.</Card>'
          new = '<Card className="p-5 text-center text-xs"><span style={{ color: "var(--text-4)" }}>Nenhum colaborador encontrado.</span></Card>'
          if old not in text:
              raise SystemExit('Contrato visual esperado não encontrado')
          path.write_text(text.replace(old, new))
      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/individual.tsx
          git commit -m "Fix individual analysis type contract"
          git push origin HEAD:main
