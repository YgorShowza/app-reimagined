name: Refresh Cloudflare dependencies

on:
  push:
    branches: [cleanup/api-only-cloudflare]

permissions:
  contents: write

jobs:
  refresh:
    if: contains(github.event.head_commit.message, 'Bootstrap Cloudflare dependency migration')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: cleanup/api-only-cloudflare

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Replace legacy dependencies
        shell: bash
        run: |
          set -euo pipefail
          bun remove @supabase/supabase-js @lovable.dev/vite-tanstack-config nitro
          bun add -d @cloudflare/vite-plugin wrangler

      - name: Commit lockfile and dependency set
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Cloudflare dependency set"
          git push origin HEAD:cleanup/api-only-cloudflare
