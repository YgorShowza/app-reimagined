name: SEGEMPAT CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: segempat-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Supabase migration versions
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          bad=0
          versions=()
          for file in "${files[@]}"; do
            if [[ ! "$file" =~ ^[0-9]{14}_.+\.sql$ ]]; then
              echo "::error::Migration Supabase com nome inválido: $file"
              bad=1
              continue
            fi
            versions+=("${file:0:14}")
          done
          duplicates=$(printf '%s\n' "${versions[@]}" | sort | uniq -d)
          if [[ -n "$duplicates" ]]; then
            echo "::error::Versões Supabase duplicadas: $duplicates"
            bad=1
          fi
          if [[ "$bad" -ne 0 ]]; then
            exit 1
          fi
          echo "Migrations Supabase verificadas: ${#files[@]} arquivo(s), versões únicas."

      - name: Validate MySQL migration versions
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find database/mysql -maxdepth 1 -type f -name '*.sql' -printf '%f\n')
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "::error::Nenhuma migration MySQL encontrada em database/mysql"
            exit 1
          fi

          bad=0
          numeric_versions=()
          version_rows=()
          for file in "${files[@]}"; do
            if [[ ! "$file" =~ ^[0-9]{3,}_.+\.sql$ ]]; then
              echo "::error::Migration MySQL com nome inválido: $file"
              bad=1
              continue
            fi
            version="${file%%_*}"
            value=$((10#$version))
            numeric_versions+=("$value")
            version_rows+=("$value|$version|$file")
          done

          duplicates=$(printf '%s\n' "${numeric_versions[@]}" | sort -n | uniq -d)
          if [[ -n "$duplicates" ]]; then
            echo "::error::Versões MySQL numericamente duplicadas: $duplicates"
            bad=1
          fi

          mapfile -t ordered < <(printf '%s\n' "${version_rows[@]}" | sort -t'|' -k1,1n -k3,3)
          first_value="${ordered[0]%%|*}"
          if [[ "$first_value" -ne 1 ]]; then
            echo "::error::A primeira migration MySQL deve ser a versão numérica 001"
            bad=1
          fi

          if [[ "$bad" -ne 0 ]]; then
            exit 1
          fi
          echo "Migrations MySQL verificadas: ${#files[@]} arquivo(s), versões numericamente únicas e ordenáveis."

      - name: Setup Node for MySQL API validation
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate MySQL API syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find server/src server/scripts -type f -name '*.js' | sort)

      - name: Validate production API configuration
        shell: bash
        env:
          NODE_ENV: production
          MYSQL_HOST: 127.0.0.1
          MYSQL_DATABASE: segempat_ci
          MYSQL_USER: segempat_ci
          MYSQL_PASSWORD: ci-password-only
          MYSQL_SSL: "false"
          SEGEMPAT_SESSION_SECRET: ci-only-session-secret-with-at-least-32-bytes
          SEGEMPAT_SESSION_SECURE: "true"
          SEGEMPAT_ALLOWED_ORIGINS: https://segempat.example.test
          SEGEMPAT_STORAGE_DRIVER: filesystem
          SEGEMPAT_STORAGE_PATH: /tmp/segempat-ci-storage
        run: |
          set -euo pipefail
          mkdir -p "$SEGEMPAT_STORAGE_PATH"
          node --input-type=module -e "const { config } = await import('./server/src/config.js'); if (config.nodeEnv !== 'production' || config.storage.driver !== 'filesystem' || config.allowedOrigins.length !== 1) process.exit(1); console.log('Configuração de produção da API validada.');"

      - name: Reject unsafe production configuration
        shell: bash
        env:
          NODE_ENV: production
          MYSQL_HOST: 127.0.0.1
          MYSQL_DATABASE: segempat_ci
          MYSQL_USER: segempat_ci
          MYSQL_PASSWORD: ci-password-only
          MYSQL_SSL: "false"
          SEGEMPAT_SESSION_SECRET: ci-only-session-secret-with-at-least-32-bytes
          SEGEMPAT_SESSION_SECURE: "true"
          SEGEMPAT_ALLOWED_ORIGINS: https://segempat.example.test
          SEGEMPAT_STORAGE_DRIVER: filesystem
          SEGEMPAT_STORAGE_PATH: /tmp/segempat-ci-storage
        run: |
          set -euo pipefail
          expect_rejected() {
            description="$1"
            shift
            if env "$@" node --input-type=module -e "await import('./server/src/config.js')" >/tmp/segempat-config-negative.log 2>&1; then
              cat /tmp/segempat-config-negative.log
              echo "::error::Configuração insegura foi aceita: $description"
              exit 1
            fi
            echo "Rejeição confirmada: $description"
          }

          expect_rejected "cookie sem Secure em produção" SEGEMPAT_SESSION_SECURE=false
          expect_rejected "origem HTTP em produção" SEGEMPAT_ALLOWED_ORIGINS=http://segempat.example.test
          expect_rejected "storage relativo em produção" SEGEMPAT_STORAGE_PATH=./storage
          expect_rejected "timezone inválida" SEGEMPAT_TIMEZONE=Invalid/Timezone
          expect_rejected "senha MySQL placeholder" MYSQL_PASSWORD=CHANGE_ME
          expect_rejected "segredo de sessão placeholder" SEGEMPAT_SESSION_SECRET=CHANGE_ME_TO_A_LONG_RANDOM_SECRET_32_BYTES_MINIMUM
          expect_rejected "host MySQL somente com espaços" MYSQL_HOST="   "
          expect_rejected "CA MySQL informada com TLS desabilitado" MYSQL_SSL=false MYSQL_SSL_CA_PATH=/tmp/mysql-ca.pem
          expect_rejected "CA MySQL relativa em produção" MYSQL_SSL=true MYSQL_SSL_CA_PATH=./mysql-ca.pem

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Production build
        run: bun run build
