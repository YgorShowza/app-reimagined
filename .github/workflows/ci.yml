name: SEGEMPAT CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: segempat-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies and refresh lockfile
        run: bun install

      - name: Persist refreshed lockfile
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "Atualiza bun.lock [skip ci]"
            git push
          fi

      - name: Production build
        id: build
        shell: bash
        run: |
          set -o pipefail
          bun run build 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: segempat-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 1
