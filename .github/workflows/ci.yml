name: SEGEMPAT CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: segempat-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Supabase migration versions
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          bad=0
          versions=()
          for file in "${files[@]}"; do
            if [[ ! "$file" =~ ^[0-9]{14}_.+\.sql$ ]]; then
              echo "::error::Migration Supabase com nome inválido: $file"
              bad=1
              continue
            fi
            versions+=("${file:0:14}")
          done
          duplicates=$(printf '%s\n' "${versions[@]}" | sort | uniq -d)
          if [[ -n "$duplicates" ]]; then
            echo "::error::Versões Supabase duplicadas: $duplicates"
            bad=1
          fi
          if [[ "$bad" -ne 0 ]]; then
            exit 1
          fi
          echo "Migrations Supabase verificadas: ${#files[@]} arquivo(s), versões únicas."

      - name: Validate MySQL migration versions
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find database/mysql -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "::error::Nenhuma migration MySQL encontrada em database/mysql"
            exit 1
          fi
          bad=0
          versions=()
          previous=""
          for file in "${files[@]}"; do
            if [[ ! "$file" =~ ^[0-9]{3,}_.+\.sql$ ]]; then
              echo "::error::Migration MySQL com nome inválido: $file"
              bad=1
              continue
            fi
            version="${file%%_*}"
            versions+=("$version")
            if [[ -n "$previous" && "$version" < "$previous" ]]; then
              echo "::error::Ordem de migrations MySQL inválida: $previous antes de $version"
              bad=1
            fi
            previous="$version"
          done
          duplicates=$(printf '%s\n' "${versions[@]}" | sort | uniq -d)
          if [[ -n "$duplicates" ]]; then
            echo "::error::Versões MySQL duplicadas: $duplicates"
            bad=1
          fi
          if [[ "${files[0]}" != 001_* ]]; then
            echo "::error::A primeira migration MySQL deve ser o baseline 001_*.sql"
            bad=1
          fi
          if [[ "$bad" -ne 0 ]]; then
            exit 1
          fi
          echo "Migrations MySQL verificadas: ${#files[@]} arquivo(s), versões únicas e ordenadas."

      - name: Setup Node for MySQL API validation
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate MySQL API syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find server/src server/scripts -type f -name '*.js' | sort)

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Production build
        run: bun run build
