name: SEGEMPAT CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: segempat-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies and refresh lockfile
        run: bun install

      - name: Production build
        run: bun run build

      - name: Upload refreshed lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-bun-lock
          path: bun.lock
          retention-days: 1
