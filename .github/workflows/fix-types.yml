name: SEGEMPAT Fix Typecheck

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-types.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact type fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'src/components/cronograma/CronogramaWorkspace.tsx': [
                  (
                      'const completeEntry = useMutation({ mutationFn: markCronogramaEntryComplete,',
                      'const completeEntry = useMutation({ mutationFn: (id: string) => markCronogramaEntryComplete(id),'
                  ),
              ],
              'src/routes/_authenticated/individual.tsx': [
                  ('<Card className="overflow-hidden" style={undefined as never}>', '<Card className="overflow-hidden">'),
              ],
              'src/routes/_authenticated/prova-realizar.tsx': [
                  ('value={String(answers[question?.id] ?? "")}', 'value={question ? String(answers[question.id] ?? "") : ""}'),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {filename}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
      - name: Commit fixes
        run: |
          git config user.name "SEGEMPAT CI"
          git config user.email "actions@github.com"
          git add src/components/cronograma/CronogramaWorkspace.tsx src/routes/_authenticated/individual.tsx src/routes/_authenticated/prova-realizar.tsx
          git commit -m "Corrige erros restantes do typecheck" || exit 0
          git push
