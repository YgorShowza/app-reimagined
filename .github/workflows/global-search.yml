name: SEGEMPAT Global Search

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: segempat-global-search-${{ github.ref }}
  cancel-in-progress: true

jobs:
  global-search-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate role-aware global search
        shell: bash
        run: |
          set -euo pipefail
          FILE=src/components/GlobalSearch.tsx
          LAYOUT=src/components/AppLayout.tsx
          test -f "$FILE"
          grep -F 'Ctrl/Cmd + K' "$FILE" >/dev/null
          grep -F 'open && isAdmin' "$FILE" >/dev/null
          grep -F 'listEmployees' "$FILE" >/dev/null
          grep -F 'listOccurrences' "$FILE" >/dev/null
          grep -F 'listKnowledgeItems' "$FILE" >/dev/null
          grep -F 'audience: "admin"' "$FILE" >/dev/null
          grep -F 'audience: "operator"' "$FILE" >/dev/null
          grep -F 'audience: "all"' "$FILE" >/dev/null
          grep -F 'Uma fonte de dados está indisponível' "$FILE" >/dev/null
          grep -F '<GlobalSearch />' "$LAYOUT" >/dev/null
          echo "Busca Global SEGEMPAT validada."
