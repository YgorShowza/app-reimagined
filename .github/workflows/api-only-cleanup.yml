name: SEGEMPAT API-only cleanup

on:
  push:
    branches: [cleanup/api-only-cloudflare]
  pull_request:
    branches: [main]

jobs:
  api-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Reject legacy runtime/build dependencies
        shell: bash
        run: |
          set -euo pipefail
          test ! -d supabase
          test ! -d src/integrations/supabase
          test ! -d .lovable
          if grep -RInE --exclude-dir=node_modules --exclude='bun.lock' --exclude='*.md' '(supabase|lovable)' src package.json vite.config.ts 2>/dev/null; then
            echo '::error::Ainda existem referências ativas a Supabase/Lovable.'
            exit 1
          fi
          echo 'Nenhuma referência ativa a Supabase/Lovable encontrada.'

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build API-only
        env:
          VITE_SEGEMPAT_API_URL: https://segempat-api.example.test
          VITE_SEGEMPAT_REQUIRE_API: "true"
        run: bun run build
