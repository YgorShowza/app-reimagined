name: SEGEMPAT Cloudflare Deployment Readiness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: segempat-cloudflare-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloudflare-dry-run:
    name: Cloudflare Deployment Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Cloudflare contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F '"@cloudflare/vite-plugin"' package.json >/dev/null
          grep -F '"wrangler"' package.json >/dev/null
          grep -F 'cloudflare({ viteEnvironment: { name: "ssr" } })' vite.config.ts >/dev/null
          grep -F '"main": "@tanstack/react-start/server-entry"' wrangler.jsonc >/dev/null
          grep -F '"nodejs_compat"' wrangler.jsonc >/dev/null
          grep -F '"workers_dev": true' wrangler.jsonc >/dev/null
          echo "Contrato Cloudflare presente e coerente."

      - name: Build corporate frontend
        env:
          VITE_SEGEMPAT_API_URL: https://segempat-api.example.test
          VITE_SEGEMPAT_REQUIRE_API: "true"
        run: bun run build

      - name: Cloudflare deploy dry-run
        env:
          CI: "true"
          VITE_SEGEMPAT_API_URL: https://segempat-api.example.test
          VITE_SEGEMPAT_REQUIRE_API: "true"
        run: bunx wrangler deploy --dry-run --outdir .wrangler-dry-run

      - name: Validate dry-run artifact
        shell: bash
        run: |
          set -euo pipefail
          test -d .wrangler-dry-run
          test -n "$(find .wrangler-dry-run -type f -print -quit)"
          echo "Pacote Cloudflare compilado em dry-run sem publicação."
