name: SEGEMPAT Privilege Separation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: segempat-privilege-separation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privilege-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate TI and Inspector boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'Perfil Inspetor é administrado exclusivamente pela TI' server/src/routes/employees.js >/dev/null
          grep -F 'Privilégio de Inspetor, status e identidade privilegiada são administrados exclusivamente pela TI' server/src/routes/employees.js >/dev/null
          grep -F 'Cadastro de Inspetor é administrado exclusivamente pela TI' server/src/routes/employees.js >/dev/null
          grep -F 'CONFIRM_PRIVILEGED_ACCESS' server/scripts/manage-inspector-access.js >/dev/null
          grep -F 'TI_OPERATOR' server/scripts/manage-inspector-access.js >/dev/null
          grep -F 'TI_GRANT_INSPECTOR' server/scripts/manage-inspector-access.js >/dev/null
          grep -F 'TI_REVOKE_INSPECTOR' server/scripts/manage-inspector-access.js >/dev/null
          grep -F 'último Inspetor ativo com acesso administrativo' server/scripts/manage-inspector-access.js >/dev/null
          grep -F 'session_epoch = session_epoch + 1' server/scripts/manage-inspector-access.js >/dev/null
          grep -F 'session_epoch = session_epoch + 1' server/src/routes/employees.js >/dev/null
          grep -F 'u.session_epoch' server/src/session.js >/dev/null
          grep -F 'credential-version:${passwordHash}:epoch:' server/src/session.js >/dev/null
          grep -F '"manage-inspector-access"' server/package.json >/dev/null
          grep -F '"report-privileged-access"' server/package.json >/dev/null
          grep -F '"migrate": "node scripts/migrate-with-ti-credentials.js"' server/package.json >/dev/null
          grep -F 'check-runtime-grants.js' server/package.json >/dev/null
          grep -F 'MYSQL_MIGRATION_USER' server/scripts/migrate-with-ti-credentials.js >/dev/null
          grep -F 'deve ser diferente de MYSQL_USER em produção' server/scripts/migrate-with-ti-credentials.js >/dev/null
          grep -F 'MYSQL_MIGRATION_PASSWORD' server/.env.example >/dev/null
          grep -F 'check-governance-integrity.js' server/package.json >/dev/null
          grep -F 'audit_logs_block_update' database/mysql/006_governance_audit_session_hardening.sql >/dev/null
          grep -F 'audit_logs_block_delete' database/mysql/006_governance_audit_session_hardening.sql >/dev/null
          grep -F 'ADD COLUMN session_epoch BIGINT UNSIGNED NOT NULL DEFAULT 0' database/mysql/006_governance_audit_session_hardening.sql >/dev/null
          grep -F 'ROLE_ADMIN_INDEVIDA' server/scripts/report-privileged-access.js >/dev/null
          grep -F 'export const PERFIS = ["Operacional"]' src/lib/employees.ts >/dev/null
          grep -F 'component: TeamManagementWorkspace' src/routes/_authenticated/equipe.tsx >/dev/null
          grep -F 'Inspetor · TI' src/components/team/TeamManagementWorkspace.tsx >/dev/null
          grep -F 'disabled={editingPrivileged}' src/components/team/TeamManagementWorkspace.tsx >/dev/null
          grep -F 'LGPD_GOVERNANCE.md' MYSQL_TI_INPUTS.md >/dev/null
          grep -F 'TI_GRANT_INSPECTOR' LGPD_GOVERNANCE.md >/dev/null
          node --check server/src/routes/employees.js
          node --check server/src/session.js
          node --check server/src/runtime-grants.js
          node --check server/scripts/manage-inspector-access.js
          node --check server/scripts/report-privileged-access.js
          node --check server/scripts/check-governance-integrity.js
          node --check server/scripts/check-runtime-grants.js
          node --check server/scripts/migrate-with-ti-credentials.js

          if NODE_ENV=production MYSQL_USER=segempat_app MYSQL_PASSWORD=runtime node server/scripts/migrate-with-ti-credentials.js >/tmp/migrate-gate.log 2>&1; then
            echo "::error::Migration de produção foi aceita sem credencial separada da TI"
            exit 1
          fi
          grep -F 'produção exige credencial de migration controlada pela TI' /tmp/migrate-gate.log >/dev/null

          if NODE_ENV=production MYSQL_USER=segempat_app MYSQL_PASSWORD=runtime MYSQL_MIGRATION_USER=segempat_app MYSQL_MIGRATION_PASSWORD=migration node server/scripts/migrate-with-ti-credentials.js >/tmp/migrate-same-user.log 2>&1; then
            echo "::error::Migration de produção aceitou o mesmo usuário da API"
            exit 1
          fi
          grep -F 'deve ser diferente de MYSQL_USER em produção' /tmp/migrate-same-user.log >/dev/null

          node --input-type=module <<'NODE'
          const { validateRuntimeGrantStatements } = await import('./server/src/runtime-grants.js');
          const safe = [
            "GRANT USAGE ON *.* TO `segempat_app`@`%`",
            "GRANT SELECT, INSERT, UPDATE, DELETE ON `segempat`.* TO `segempat_app`@`%`",
          ];
          if (validateRuntimeGrantStatements(safe, 'segempat').length !== 0) {
            throw new Error('Política rejeitou grants mínimos válidos');
          }
          const unsafeSets = [
            ["GRANT ALL PRIVILEGES ON `segempat`.* TO `segempat_app`@`%`"],
            ["GRANT CREATE, SELECT ON `segempat`.* TO `segempat_app`@`%`"],
            ["GRANT SELECT ON *.* TO `segempat_app`@`%`"],
            ["GRANT SELECT ON `outro_banco`.* TO `segempat_app`@`%`"],
            ["GRANT SELECT ON `segempat`.* TO `segempat_app`@`%` WITH GRANT OPTION"],
          ];
          for (const grants of unsafeSets) {
            if (validateRuntimeGrantStatements(grants, 'segempat').length === 0) {
              throw new Error(`Política aceitou grant inseguro: ${grants[0]}`);
            }
          }
          console.log('Política de grants mínimos validada.');
          NODE

          echo "Segregação TI x Inspetoria, auditoria, migrations e grants mínimos validados."
