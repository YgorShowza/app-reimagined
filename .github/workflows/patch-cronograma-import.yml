name: Patch Cronograma Import

on:
  push:
    paths:
      - '.github/workflows/patch-cronograma-import.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/patch_cronograma_import.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/cronograma/CronogramaImportResults.tsx
          git diff --cached --check
          git commit -m 'Usa importação atômica no Cronograma'
          git push
